<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>LUMO — Advanced Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #222222;
            --accent-primary: #3b82f6;
            --accent-secondary: #22c55e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --glow-primary: rgba(59, 130, 246, 0.25);
            --glow-secondary: rgba(34, 197, 94, 0.15);
        }

        .light-mode {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-card: #ffffff;
            --accent-primary: #3b82f6;
            --accent-secondary: #22c55e;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --glow-primary: rgba(59, 130, 246, 0.15);
            --glow-secondary: rgba(34, 197, 94, 0.1);
        }

        body {
            background:
                radial-gradient(circle at 10% 10%, var(--glow-primary), transparent 35%),
                radial-gradient(circle at 90% 20%, var(--glow-primary), transparent 35%),
                radial-gradient(circle at 20% 90%, var(--glow-secondary), transparent 40%),
                radial-gradient(circle at 80% 80%, var(--glow-secondary), transparent 45%),
                var(--bg-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            transition: background 0.5s ease, color 0.3s ease;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .light-mode .glass {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        @keyframes messageSlide {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .message-animate {
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 14px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .mic-pulse {
            animation: pulseGlow 2s infinite;
        }

        @keyframes recordingGlow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: recordingGlow 1.5s infinite;
            background: linear-gradient(135deg, #ef4444, #f59e0b) !important;
        }

        .status-indicator {
            position: relative;
        }
        .status-indicator::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }
        .status-indicator.online::after {
            background: #22c55e;
        }
        .status-indicator.connecting::after {
            background: #f59e0b;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }
        .connection-dot.online {
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }
        .connection-dot.connecting {
            background: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .light-mode .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hover-lift {
            transition: all 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            border-color: var(--accent-primary);
        }

        .theme-toggle {
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            transform: rotate(15deg);
        }

        .recent-btn {
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }
        .recent-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }
        .light-mode .recent-btn {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: var(--text-secondary);
        }
        .light-mode .recent-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            color: var(--text-primary);
        }

        .new-chat-btn {
            padding: 10px 16px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
        }
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .chat-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .chat-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-left: 3px solid var(--accent-primary);
        }
        .light-mode .chat-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        .light-mode .chat-item.active {
            background: rgba(59, 130, 246, 0.1);
        }

        .context-menu {
            position: fixed;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 120px;
            backdrop-filter: blur(12px);
        }
        .context-menu-item {
            width: 100%;
            padding: 8px 12px;
            text-align: left;
            border: none;
            background: none;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.875rem;
            transition: background 0.2s ease;
        }
        .context-menu-item:hover {
            background: rgba(59, 130, 246, 0.2);
        }
        .context-menu-item.delete {
            color: #ef4444;
        }
        .context-menu-item.delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .rename-input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.875rem;
        }
        .rename-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .voice-mode-btn {
            padding: 6px 12px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            transition: all 0.2s ease;
            cursor: pointer;
            white-space: nowrap;
        }
        .voice-mode-btn.active {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .voice-mode-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .light-mode .voice-mode-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .recording-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            font-size: 0.75rem;
            animation: pulseGlow 2s infinite;
            white-space: nowrap;
        }
        .recording-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        
        .safe-area-top {
            padding-top: env(safe-area-inset-top, 0);
        }

        .touch-button {
            min-height: 44px;
            min-width: 44px;
        }

        .responsive-text {
            font-size: clamp(0.75rem, 2vw, 1rem);
        }

        .flexible-container {
            flex: 1;
            min-width: 0;
        }

        .voice-controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));
            gap: 8px;
            width: 100%;
        }

        .mobile-drawer {
            width: 100%;
            max-width: 320px;
        }

        .message-bubble {
            max-width: min(90%, 700px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (max-width: 640px) {
            .mobile-flex-col {
                flex-direction: column;
            }
            
            .mobile-w-full {
                width: 100%;
            }
            
            .mobile-text-sm {
                font-size: 0.875rem;
            }
            
            .mobile-p-3 {
                padding: 0.75rem;
            }
            
            .mobile-gap-2 {
                gap: 0.5rem;
            }
            
            .mobile-hidden {
                display: none !important;
            }
            
            .mobile-block {
                display: block !important;
            }
            
            .mobile-justify-between {
                justify-content: space-between;
            }
            
            .mobile-space-y-2 > * + * {
                margin-top: 0.5rem;
            }
            
            .mobile-message-avatar {
                width: 32px;
                height: 32px;
                font-size: 0.875rem;
            }
            
            .mobile-input-area {
                padding: 0.75rem;
                gap: 0.5rem;
            }
            
            .mobile-touch-button {
                min-height: 48px;
                min-width: 48px;
                padding: 0.75rem;
            }
            
            .mobile-toolbar {
                padding: 0.75rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            
            .mobile-voice-single-col {
                flex-direction: column;
                align-items: stretch;
            }
            
            .mobile-voice-single-col > * {
                width: 100%;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .tablet-flex-col {
                flex-direction: column;
            }
            
            .tablet-w-full {
                width: 100%;
            }
            
            .tablet-text-base {
                font-size: 1rem;
            }
        }

        @media (min-width: 1025px) {
            .desktop-flex-row {
                flex-direction: row;
            }
            
            .desktop-w-auto {
                width: auto;
            }
        }
        
        @media (max-width: 768px) {
            input, textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body class="dark-mode">

<div class="flex w-full h-full">

    <section class="flex-1 flex flex-col safe-area-top">

        <div class="mobile-toolbar p-4 flex items-center justify-between border-b glass" style="border-color: var(--border-color);">
            <div class="flex items-center gap-3 mobile-w-full mobile-justify-between">
                <div class="flex items-center gap-3">
                    <button id="menuToggle" class="touch-button p-2 rounded-lg hover-lift mobile-touch-button" style="background: var(--bg-card);">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>

                    <div class="connection-status mobile-hidden tablet-flex-col">
                        <div id="connectionDot" class="connection-dot online"></div>
                        <span id="connectionStatus" class="text-sm mobile-text-sm">Ready</span>
                    </div>

                    <div id="recordingStatus" class="recording-status hidden">
                        <div class="recording-dot"></div>
                        <span class="mobile-text-sm">Recording...</span>
                    </div>
                </div>

                <div class="text-sm mobile-text-sm text-center flex-1 mx-2" style="color: var(--text-secondary);" id="currentChatTitle">New Chat</div>

                <div class="flex items-center gap-2">
                    <button id="themeToggle" class="touch-button p-2 rounded-lg hover-lift theme-toggle mobile-touch-button" style="background: var(--bg-card);">
                        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>

                    <div class="connection-status mobile-block tablet-flex-col hidden">
                        <div id="mobileConnectionDot" class="connection-dot online"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mobile-toolbar p-3 border-b flex items-center gap-2 mobile-voice-single-col" style="border-color: var(--border-color); background: var(--bg-secondary);">
            <div class="flex items-center gap-1 p-1 rounded-lg mobile-w-full" style="background: var(--bg-card);">
                <button id="browserVoiceBtn" class="voice-mode-btn active mobile-text-sm mobile-w-full text-center">Browser Voice</button>
                <button id="webSpeechBtn" class="voice-mode-btn mobile-text-sm mobile-w-full text-center">Web Speech</button>
            </div>

            <div class="flex items-center gap-2 mobile-w-full">
                <button id="voiceToggle" class="touch-button px-3 py-2 rounded-lg glass hover-lift text-sm mobile-text-sm mobile-w-full text-center">Voice: <span id="voiceState">On</span></button>

                <button id="clearBtn" class="touch-button px-3 py-2 rounded-lg glass hover-lift text-sm mobile-text-sm mobile-w-full text-center">Clear Chat</button>
            </div>
        </div>

        <main class="flexible-container flex flex-col p-3 sm:p-4 md:p-6 overflow-hidden">
            <div class="h-full flex flex-col">
                <div id="messages" class="flexible-container overflow-y-auto custom-scrollbar no-scrollbar space-y-3 sm:space-y-4 pr-2">
                    <div class="flex items-start gap-3 sm:gap-4 message-animate">
                        <div class="mobile-message-avatar w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold" style="background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary))">L</div>
                        <div class="glass p-3 sm:p-4 rounded-xl message-bubble">
                            <div class="text-sm mobile-text-sm font-medium">Hello — I'm LUMO.</div>
                            <div class="text-xs mobile-text-sm mt-1" style="color: var(--text-secondary);">Type a command or press the mic to begin.</div>
                            <div class="text-xs mobile-text-sm mt-2" style="color: var(--text-secondary);">Voice Mode: <span id="currentVoiceMode">Browser Voice</span></div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 sm:mt-6 pt-3 sm:pt-4 border-t safe-area-bottom mobile-input-area flex flex-col sm:flex-row items-center gap-3 sm:gap-4" style="border-color: var(--border-color);">
                    <div class="voice-controls-grid sm:flex sm:items-center sm:gap-2 w-full sm:w-auto">
                        <div id="browserVoiceControls" class="flex items-center justify-center gap-2">
                            <button id="startVoiceBtn" class="touch-button mobile-touch-button w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center text-white shadow-lg hover-lift" style="background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary))">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v11m0 0a3 3 0 01-3 3 3 3 0 01-3-3V9a3 3 0 013-3m6 0a3 3 0 013 3v2a3 3 0 01-3 3" />
                                </svg>
                            </button>
                            <button id="stopVoiceBtn" class="touch-button mobile-touch-button w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center text-white shadow-lg hover-lift hidden" style="background:linear-gradient(135deg,#ef4444,#f59e0b)">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                                </svg>
                            </button>
                        </div>

                        <button id="webSpeechMic" class="touch-button mobile-touch-button w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center text-white shadow-lg hover-lift hidden" style="background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary))">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v11m0 0a3 3 0 01-3 3 3 3 0 01-3-3V9a3 3 0 013-3m6 0a3 3 0 013 3v2a3 3 0 01-3 3" />
                            </svg>
                        </button>
                    </div>

                    <input id="cmdInput" class="flexible-container touch-button p-3 sm:p-4 rounded-xl glass input-focus mobile-text-sm" 
                           placeholder="Type a command or use voice..." 
                           style="background: var(--bg-card); color: var(--text-primary);"
                           autocomplete="off"
                           autocorrect="off"
                           autocapitalize="off"
                           spellcheck="false" />

                    <button id="sendBtn" class="touch-button mobile-touch-button px-4 py-3 sm:px-5 sm:py-3 rounded-xl text-white font-medium hover-lift w-full sm:w-auto" style="background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary))">
                        <span class="mobile-hidden sm:inline">Send</span>
                        <svg class="inline sm:hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </section>
</div>

<div id="mobileDrawer" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-70" id="drawerOverlay"></div>
    <div class="absolute left-0 top-0 h-full mobile-drawer glass transform -translate-x-full transition-transform duration-300" id="drawer" style="background: var(--bg-secondary);">
        <div class="p-4 sm:p-6 h-full flex flex-col safe-area-top safe-area-bottom">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="mobile-message-avatar w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold" style="background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));">L</div>
                    <div>
                        <h2 class="text-lg mobile-text-sm font-bold gradient-text">LUMO</h2>
                        <p class="text-xs mobile-text-sm" style="color: var(--text-secondary);">Voice Assistant</p>
                    </div>
                </div>
                <button id="closeDrawer" class="touch-button p-2 rounded-lg hover-lift mobile-touch-button" style="background: var(--bg-card);">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <button id="newChatBtn" class="new-chat-btn mb-6 touch-button">
                <div class="flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    New Chat
                </div>
            </button>

            <div class="space-y-4 flexible-container">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm mobile-text-sm font-medium" style="color: var(--text-secondary);">Recent Chats</h3>
                    <button id="clearRecentChatsBtn" class="recent-btn touch-button">Clear</button>
                </div>
                <div id="drawerRecentChats" class="space-y-2 text-sm mobile-text-sm flexible-container overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <div class="text-xs mobile-text-sm mt-auto pt-4 sm:pt-6 border-t" style="color: var(--text-secondary); border-color: var(--border-color);">
                <div class="break-all">Backend: <span id="apiUrlDisplayDrawer">http://127.0.0.1:5000</span></div>
                <div class="mt-1">Voice Mode: <span id="voiceModeDisplay">Browser Voice</span></div>
                <div class="mt-1">Status: <span id="drawerStatus">Ready</span></div>
                <div class="mt-1">Version 3.0 · Multi-Mode UI</div>
            </div>
        </div>
    </div>
</div>

<div id="contextMenu" class="context-menu hidden">
    <button class="context-menu-item touch-button" id="renameChatBtn">Rename</button>
    <button class="context-menu-item delete touch-button" id="deleteChatBtn">Delete</button>
</div>

<script>
    const SERVER_IP = window.location.hostname;
    let API_URL = `http://${SERVER_IP}:5000/api/command`;
    let BROWSER_VOICE_API_URL = `http://${SERVER_IP}:5000/api/browser_voice`;
    document.getElementById('apiUrlDisplayDrawer').textContent = `http://${SERVER_IP}:5000`;

    const messagesEl = document.getElementById('messages');
    const drawerRecentChats = document.getElementById('drawerRecentChats');
    const cmdInput = document.getElementById('cmdInput');
    const sendBtn = document.getElementById('sendBtn');
    const connectionDot = document.getElementById('connectionDot');
    const mobileConnectionDot = document.getElementById('mobileConnectionDot');
    const connectionStatus = document.getElementById('connectionStatus');
    const currentChatTitle = document.getElementById('currentChatTitle');
    const contextMenu = document.getElementById('contextMenu');
    const recordingStatus = document.getElementById('recordingStatus');
    const currentVoiceMode = document.getElementById('currentVoiceMode');
    const voiceModeDisplay = document.getElementById('voiceModeDisplay');
    const drawerStatus = document.getElementById('drawerStatus');

    const chatsStorageKey = 'lumo_chats_v2';
    const currentChatIdKey = 'lumo_current_chat_id';
    const voiceModeKey = 'lumo_voice_mode_v2';

    let isRecording = false;
    let isListening = false;
    let recognition = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentChatId = null;
    let chats = {};
    let contextMenuChatId = null;
    let longPressTimer = null;
    let currentVoiceModeType = localStorage.getItem(voiceModeKey) || 'browser';
    let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    let isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    function setupForDevice() {
        if (isMobile || isTouchDevice) {
            document.body.classList.add('mobile');
            cmdInput.setAttribute('autocorrect', 'off');
            cmdInput.setAttribute('autocapitalize', 'none');
            
            const metaViewport = document.querySelector('meta[name="viewport"]');
            let originalContent = metaViewport.getAttribute('content');
            metaViewport.setAttribute('content', originalContent + ', maximum-scale=1.0, user-scalable=no');
            
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.98)';
                });
                btn.addEventListener('touchend', function() {
                    this.style.transform = '';
                });
            });
        }
        
        updateConnectionDisplay();
    }

    async function startBrowserVoice() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    sampleRate: 44100
                }
            });
            
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'audio/webm;codecs=opus'
            });
            
            audioChunks = [];

            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) {
                    audioChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = async () => {
                if (audioChunks.length === 0) {
                    appendMessage('lumo', 'No audio recorded. Please try again.');
                    return;
                }

                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append("audio", audioBlob, "voice.webm");

                try {
                    setConnectionStatus('Processing voice...', 'connecting');
                    
                    const res = await fetch(BROWSER_VOICE_API_URL, {
                        method: "POST",
                        body: formData
                    });

                    const data = await res.json();

                    if (data.recognizedText) {
                        appendMessage("user", data.recognizedText);
                    }
                    if (data.displayText) {
                        appendMessage("lumo", data.displayText);
                    }
                    
                    setConnectionStatus('Ready', 'online');
                } catch (err) {
                    console.error('Voice processing error:', err);
                    appendMessage('lumo', 'Could not process voice input. Please try again.');
                    setConnectionStatus('Voice error', 'offline');
                    setTimeout(() => setConnectionStatus('Ready', 'online'), 2000);
                }
            };

            mediaRecorder.start();
            isRecording = true;
            
            updateRecordingUI(true);
            
        } catch (err) {
            console.error('Error accessing microphone:', err);
            let errorMessage = 'Microphone access denied. ';
            if (err.name === 'NotAllowedError') {
                errorMessage += 'Please enable microphone permissions in your browser settings.';
            } else if (err.name === 'NotFoundError') {
                errorMessage += 'No microphone found. Please connect a microphone.';
            } else {
                errorMessage += 'Please check your microphone settings.';
            }
            appendMessage('lumo', errorMessage);
        }
    }

    function stopBrowserVoice() {
        if (mediaRecorder && isRecording && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            isRecording = false;
            
            updateRecordingUI(false);
            
            if (mediaRecorder.stream) {
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }
    }

    function updateRecordingUI(recording) {
        const startBtn = document.getElementById('startVoiceBtn');
        const stopBtn = document.getElementById('stopVoiceBtn');
        
        if (recording) {
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            startBtn.classList.add('recording-pulse');
            recordingStatus.classList.remove('hidden');
            recordingStatus.innerHTML = '<div class="recording-dot"></div><span>Recording... Tap to stop</span>';
        } else {
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            startBtn.classList.remove('recording-pulse');
            recordingStatus.classList.add('hidden');
        }
    }

    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;
        
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            appendMessage('lumo', '⚠️ Web Speech API works best with HTTPS. For best results, use HTTPS or localhost.');
        }
        
        if (!SpeechRecognition) {
            appendMessage('lumo', 'Web Speech API is not supported in this browser. Try using Browser Voice mode instead.');
            return null;
        }
        
        const r = new SpeechRecognition();
        r.lang = 'en-US';
        r.interimResults = false;
        r.maxAlternatives = 1;
        r.continuous = false;
        
        r.onstart = () => {
            isListening = true;
            document.getElementById('webSpeechMic').classList.add('mic-pulse');
            recordingStatus.classList.remove('hidden');
            recordingStatus.innerHTML = '<div class="recording-dot"></div><span>Listening... Speak now</span>';
            setConnectionStatus('Listening...', 'connecting');
        };
        
        r.onend = () => {
            isListening = false;
            document.getElementById('webSpeechMic').classList.remove('mic-pulse');
            recordingStatus.classList.add('hidden');
            setConnectionStatus('Ready', 'online');
        };
        
        r.onerror = (e) => { 
            console.error('Speech recognition error:', e.error);
            let errorMsg = `Speech recognition error: ${e.error}`;
            if (e.error === 'not-allowed') {
                errorMsg = 'Microphone permission denied. Please allow microphone access.';
            } else if (e.error === 'audio-capture') {
                errorMsg = 'No microphone found. Please check your microphone.';
            } else if (e.error === 'network') {
                errorMsg = 'Network error. Please check your connection.';
            }
            appendMessage('lumo', errorMsg);
            recordingStatus.classList.add('hidden');
            setConnectionStatus('Speech error', 'offline');
            setTimeout(() => setConnectionStatus('Ready', 'online'), 2000);
        };
        
        r.onresult = (ev) => {
            const t = ev.results[0][0].transcript;
            cmdInput.value = t;
            sendCommand(t);
        };
        
        return r;
    }

    function toggleWebSpeechMic() {
        if (!recognition) {
            recognition = setupSpeechRecognition();
        }
        
        if (!recognition) {
            return;
        }
        
        if (isListening) { 
            recognition.stop(); 
        } else { 
            try {
                recognition.start();
            } catch (err) {
                console.error('Failed to start speech recognition:', err);
                appendMessage('lumo', 'Failed to start speech recognition. Please try again.');
            }
        }
    }

    function setVoiceMode(mode) {
        currentVoiceModeType = mode;
        localStorage.setItem(voiceModeKey, mode);
        
        document.getElementById('browserVoiceBtn').classList.toggle('active', mode === 'browser');
        document.getElementById('webSpeechBtn').classList.toggle('active', mode === 'webspeech');
        
        document.getElementById('browserVoiceControls').classList.toggle('hidden', mode !== 'browser');
        document.getElementById('webSpeechMic').classList.toggle('hidden', mode !== 'webspeech');
        
        const voiceModeText = mode === 'browser' ? 'Browser Voice' : 'Web Speech';
        currentVoiceMode.textContent = voiceModeText;
        voiceModeDisplay.textContent = voiceModeText;
        
        if (mode === 'browser' && isListening) {
            recognition.stop();
        }
        if (mode === 'webspeech' && isRecording) {
            stopBrowserVoice();
        }
        
        if (mode === 'browser') {
            cmdInput.placeholder = 'Tap mic button to record voice...';
        } else {
            cmdInput.placeholder = 'Tap mic button to speak...';
        }
    }

    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const body = document.body;

    const savedTheme = localStorage.getItem('lumo-theme');
    if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        enableLightMode();
    } else {
        enableDarkMode();
    }

    themeToggle.addEventListener('click', () => {
        if (body.classList.contains('light-mode')) {
            enableDarkMode();
        } else {
            enableLightMode();
        }
    });

    function enableLightMode() {
        body.classList.add('light-mode');
        body.classList.remove('dark-mode');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
        localStorage.setItem('lumo-theme', 'light');
    }

    function enableDarkMode() {
        body.classList.add('dark-mode');
        body.classList.remove('light-mode');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        localStorage.setItem('lumo-theme', 'dark');
    }

    const mobileDrawer = document.getElementById('mobileDrawer');
    const drawer = document.getElementById('drawer');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const menuToggle = document.getElementById('menuToggle');
    const closeDrawer = document.getElementById('closeDrawer');

    function openDrawer() {
        mobileDrawer.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        setTimeout(() => {
            drawer.classList.remove('transform', '-translate-x-full');
        }, 10);
    }

    function closeDrawerFunc() {
        drawer.classList.add('transform', '-translate-x-full');
        setTimeout(() => {
            mobileDrawer.classList.add('hidden');
            document.body.style.overflow = '';
        }, 300);
    }

    menuToggle.addEventListener('click', openDrawer);
    closeDrawer.addEventListener('click', closeDrawerFunc);
    drawerOverlay.addEventListener('click', closeDrawerFunc);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !mobileDrawer.classList.contains('hidden')) {
            closeDrawerFunc();
        }
    });

    function setupContextMenu() {
        document.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) {
                hideContextMenu();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideContextMenu();
            }
        });

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        document.getElementById('renameChatBtn').addEventListener('click', () => {
            if (contextMenuChatId) {
                renameChat(contextMenuChatId);
            }
            hideContextMenu();
        });

        document.getElementById('deleteChatBtn').addEventListener('click', () => {
            if (contextMenuChatId) {
                deleteChat(contextMenuChatId);
            }
            hideContextMenu();
        });
    }

    function showContextMenu(x, y, chatId) {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const menuWidth = 120;
        const menuHeight = 80;
        
        let posX = x;
        let posY = y;
        
        if (x + menuWidth > viewportWidth) {
            posX = viewportWidth - menuWidth - 10;
        }
        if (y + menuHeight > viewportHeight) {
            posY = viewportHeight - menuHeight - 10;
        }
        
        contextMenuChatId = chatId;
        contextMenu.style.left = posX + 'px';
        contextMenu.style.top = posY + 'px';
        contextMenu.classList.remove('hidden');
    }

    function hideContextMenu() {
        contextMenu.classList.add('hidden');
        contextMenuChatId = null;
    }

    function setupChatItemContextMenu(chatElement, chatId) {
        chatElement.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showContextMenu(e.pageX, e.pageY, chatId);
        });

        chatElement.addEventListener('touchstart', (e) => {
            longPressTimer = setTimeout(() => {
                e.preventDefault();
                const touch = e.touches[0];
                showContextMenu(touch.pageX, touch.pageY, chatId);
                chatElement.style.backgroundColor = 'rgba(59, 130, 246, 0.2)';
            }, 500);
        });

        chatElement.addEventListener('touchend', () => {
            clearTimeout(longPressTimer);
            chatElement.style.backgroundColor = '';
        });

        chatElement.addEventListener('touchmove', () => {
            clearTimeout(longPressTimer);
            chatElement.style.backgroundColor = '';
        });
    }

    function renameChat(chatId) {
        if (!chats[chatId]) return;

        const chat = chats[chatId];
        const newTitle = prompt('Enter new chat name:', chat.title);

        if (newTitle && newTitle.trim() !== '') {
            chat.title = newTitle.trim();
            chat.updatedAt = Date.now();
            saveChatsToStorage();

            if (chatId === currentChatId) {
                currentChatTitle.textContent = chat.title;
            }

            renderRecentChats();
        }
    }

    function deleteChat(chatId) {
        if (!chats[chatId]) return;

        if (Object.keys(chats).length <= 1) {
            alert('Cannot delete the only chat. Create a new chat first.');
            return;
        }

        if (confirm('Are you sure you want to delete this chat?')) {
            if (chatId === currentChatId) {
                const remainingChats = Object.keys(chats).filter(id => id !== chatId);
                const newCurrentChatId = remainingChats[0];
                loadChat(newCurrentChatId);
            }

            delete chats[chatId];
            saveChatsToStorage();
            renderRecentChats();
        }
    }

    function initChats() {
        const storedChats = localStorage.getItem(chatsStorageKey);
        if (storedChats) {
            try {
                chats = JSON.parse(storedChats);
            } catch (e) {
                console.error('Error parsing chats from storage:', e);
                chats = {};
            }
        }

        currentChatId = localStorage.getItem(currentChatIdKey);

        if (!currentChatId || !chats[currentChatId]) {
            createNewChat();
        } else {
            loadChat(currentChatId);
        }

        renderRecentChats();
        setupContextMenu();
    }

    function createNewChat() {
        const chatId = 'chat_' + Date.now();
        const newChat = {
            id: chatId,
            title: 'New Chat',
            messages: [
                {
                    who: 'lumo',
                    text: "Hello — I'm LUMO. Type a command or press the mic to begin.",
                    time: Date.now(),
                    meta: {}
                }
            ],
            createdAt: Date.now(),
            updatedAt: Date.now()
        };

        chats[chatId] = newChat;
        currentChatId = chatId;

        saveChatsToStorage();
        loadChat(chatId);
        renderRecentChats();
    }

    function loadChat(chatId) {
        if (!chats[chatId]) return;

        currentChatId = chatId;
        localStorage.setItem(currentChatIdKey, chatId);

        const chat = chats[chatId];
        currentChatTitle.textContent = chat.title;

        messagesEl.innerHTML = '';
        chat.messages.forEach(message => {
            appendMessageToDOM(message.who, message.text, message.meta, false);
        });

        messagesEl.scrollTop = messagesEl.scrollHeight;
        renderRecentChats();
        
        drawerStatus.textContent = 'Ready';
    }

    function saveChatsToStorage() {
        try {
            localStorage.setItem(chatsStorageKey, JSON.stringify(chats));
            localStorage.setItem(currentChatIdKey, currentChatId);
        } catch (e) {
            console.error('Error saving to localStorage:', e);
            if (e.name === 'QuotaExceededError') {
                const chatsArray = Object.values(chats).sort((a, b) => b.updatedAt - a.updatedAt);
                const recentChats = chatsArray.slice(0, 10);
                chats = {};
                recentChats.forEach(chat => {
                    chats[chat.id] = chat;
                });
                saveChatsToStorage();
            }
        }
    }

    function updateChatTitle() {
        if (!currentChatId || !chats[currentChatId]) return;

        const chat = chats[currentChatId];
        const firstUserMessage = chat.messages.find(msg => msg.who === 'user');
        if (firstUserMessage) {
            const shortText = firstUserMessage.text.length > 30
                ? firstUserMessage.text.substring(0, 30) + '...'
                : firstUserMessage.text;
            chat.title = shortText;
            currentChatTitle.textContent = shortText;
        }

        chat.updatedAt = Date.now();
        saveChatsToStorage();
        renderRecentChats();
    }

    function renderRecentChats() {
        if (!chats || Object.keys(chats).length === 0) {
            drawerRecentChats.innerHTML = '<div class="text-center p-4" style="color: var(--text-secondary);">No recent chats</div>';
            return;
        }

        const chatsArray = Object.values(chats).sort((a, b) => b.updatedAt - a.updatedAt);

        drawerRecentChats.innerHTML = '';
        chatsArray.forEach(chat => {
            const chatEl = document.createElement('div');
            chatEl.className = `chat-item touch-button ${chat.id === currentChatId ? 'active' : ''}`;

            const time = new Date(chat.updatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            chatEl.innerHTML = `
                <div class="font-medium text-sm mobile-text-sm truncate">${chat.title}</div>
                <div class="text-xs mobile-text-sm mt-1" style="color: var(--text-secondary);">${time}</div>
            `;

            chatEl.addEventListener('click', (e) => {
                if (e.button === 0 || e.type === 'touchstart') {
                    loadChat(chat.id);
                    closeDrawerFunc();
                }
            });

            setupChatItemContextMenu(chatEl, chat.id);

            drawerRecentChats.appendChild(chatEl);
        });
    }

    function clearRecentChats() {
        if (Object.keys(chats).length <= 1) {
            alert('Cannot clear all chats. At least one chat must remain.');
            return;
        }

        if (confirm('Are you sure you want to clear all chats except the current one?')) {
            const currentChat = chats[currentChatId];
            chats = { [currentChatId]: currentChat };
            saveChatsToStorage();
            renderRecentChats();
        }
    }

    function appendMessage(who, text, meta = {}) {
        if (!currentChatId || !chats[currentChatId]) return;

        const message = { who, text, time: Date.now(), meta };
        chats[currentChatId].messages.push(message);
        chats[currentChatId].updatedAt = Date.now();

        saveChatsToStorage();
        appendMessageToDOM(who, text, meta);

        if (who === 'user' && chats[currentChatId].title === 'New Chat') {
            updateChatTitle();
        }
    }

    function appendMessageToDOM(who, text, meta = {}, animate = true) {
        const wrap = document.createElement('div');
        wrap.className = `flex items-start gap-3 sm:gap-4 ${animate ? 'message-animate' : ''}`;

        const avatar = document.createElement('div');
        avatar.className = 'mobile-message-avatar w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold';
        avatar.style.background = who === 'lumo' ?
            'linear-gradient(135deg,var(--accent-primary),var(--accent-secondary))' :
            'linear-gradient(135deg,#fb923c,#ef4444)';
        avatar.textContent = who === 'lumo' ? 'L' : 'U';

        const bubble = document.createElement('div');
        bubble.className = 'glass p-3 sm:p-4 rounded-xl message-bubble';

        const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const messageContent = `<div class="text-xs mobile-text-sm mb-2" style="color: var(--text-secondary);">${timestamp}</div><div class="text-sm mobile-text-sm">${text}</div>`;

        bubble.innerHTML = messageContent.replace(/\n/g, '<br/>');

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        
        setTimeout(() => {
            messagesEl.scrollTo({
                top: messagesEl.scrollHeight,
                behavior: 'smooth'
            });
        }, 100);
    }

    async function sendCommand(command) {
        const trimmed = (command||'').trim();
        if(!trimmed) return;

        appendMessage('user', trimmed);
        setConnectionStatus('Sending...', 'connecting');

        const timeout = 15000;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type':'application/json' },
                body: JSON.stringify({
                    command: trimmed,
                    settings: {}
                }),
                signal: controller.signal
            });

            clearTimeout(timeoutId);

            if(!res.ok){
                appendMessage('lumo', `Server error: ${res.status}`);
                setConnectionStatus('Server error', 'offline');
                return;
            }

            const data = await res.json();
            const display = data.displayText || data.display_text || data.message || data.speakText || JSON.stringify(data);
            appendMessage('lumo', display);
            setConnectionStatus('Ready', 'online');

        } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') {
                appendMessage('lumo', 'Request timeout - backend is not responding.');
            } else if (err.name === 'TypeError' && err.message.includes('Failed to fetch')) {
                appendMessage('lumo', 'Network error - cannot connect to backend. Make sure server is running.');
            } else {
                appendMessage('lumo', 'Could not reach backend.');
            }
            setConnectionStatus('Disconnected', 'offline');
        }
    }

    function setConnectionStatus(text, status) {
        connectionStatus.textContent = text;
        drawerStatus.textContent = text;

        const dots = [connectionDot, mobileConnectionDot];
        dots.forEach(dot => {
            if (dot) {
                dot.className = 'connection-dot';
                if (status === 'online') {
                    dot.classList.add('online');
                } else if (status === 'connecting') {
                    dot.classList.add('connecting');
                }
            }
        });
    }

    function updateConnectionDisplay() {
        if (window.innerWidth < 640) {
            document.querySelector('.connection-status').classList.add('mobile-hidden');
            if (mobileConnectionDot) {
                mobileConnectionDot.parentElement.classList.remove('hidden');
            }
        } else {
            document.querySelector('.connection-status').classList.remove('mobile-hidden');
            if (mobileConnectionDot) {
                mobileConnectionDot.parentElement.classList.add('hidden');
            }
        }
    }

    document.getElementById('startVoiceBtn').addEventListener('click', startBrowserVoice);
    document.getElementById('stopVoiceBtn').addEventListener('click', stopBrowserVoice);

    document.getElementById('webSpeechMic').addEventListener('click', toggleWebSpeechMic);

    document.getElementById('browserVoiceBtn').addEventListener('click', () => setVoiceMode('browser'));
    document.getElementById('webSpeechBtn').addEventListener('click', () => setVoiceMode('webspeech'));

    sendBtn.addEventListener('click', () => {
        const command = cmdInput.value.trim();
        if (command) {
            sendCommand(command);
            cmdInput.value = '';
            cmdInput.focus();
        }
    });

    cmdInput.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
            e.preventDefault();
            const command = cmdInput.value.trim();
            if (command) {
                sendCommand(command);
                cmdInput.value = '';
            }
        }
    });

    document.getElementById('voiceToggle').addEventListener('click', () => {
        const voiceState = document.getElementById('voiceState');
        voiceState.textContent = voiceState.textContent === 'On' ? 'Off' : 'On';
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        if (!currentChatId || !chats[currentChatId]) return;

        if (confirm('Clear all messages in this chat?')) {
            const initialMessage = chats[currentChatId].messages.find(msg =>
                msg.who === 'lumo' && msg.text.includes("Hello — I'm LUMO")
            );

            if (initialMessage) {
                chats[currentChatId].messages = [initialMessage];
            } else {
                chats[currentChatId].messages = [{
                    who: 'lumo',
                    text: "Hello — I'm LUMO. Type a command or press the mic to begin.",
                    time: Date.now(),
                    meta: {}
                }];
            }

            chats[currentChatId].updatedAt = Date.now();
            saveChatsToStorage();
            loadChat(currentChatId);
        }
    });

    document.getElementById('newChatBtn').addEventListener('click', () => {
        createNewChat();
        closeDrawerFunc();
    });

    document.getElementById('clearRecentChatsBtn').addEventListener('click', () => {
        clearRecentChats();
    });

    function updateNetworkStatus() {
        const online = navigator.onLine;
        if (online) {
            setConnectionStatus('Ready', 'online');
        } else {
            setConnectionStatus('Offline', 'offline');
            appendMessage('lumo', 'You are offline. Please check your internet connection.');
        }
    }

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    
    window.addEventListener('resize', () => {
        updateConnectionDisplay();
        hideContextMenu();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (isRecording) {
                stopBrowserVoice();
            }
            if (isListening) {
                recognition.stop();
            }
        }
    });

    window.addEventListener('beforeunload', () => {
        if (isRecording) {
            stopBrowserVoice();
        }
        if (isListening) {
            recognition.stop();
        }
    });

    function initApp() {
        setupForDevice();
        initChats();
        setVoiceMode(currentVoiceModeType);
        setConnectionStatus('Ready', 'online');
        updateNetworkStatus();
        
        if (!isMobile) {
            setTimeout(() => cmdInput.focus(), 500);
        }
        
        setTimeout(() => {
            fetch(API_URL, { method: 'HEAD' })
                .then(() => setConnectionStatus('Ready', 'online'))
                .catch(() => setConnectionStatus('Backend offline', 'offline'));
        }, 1000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }

    window.addEventListener('keydown', e => {
        if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
            const command = cmdInput.value.trim();
            if (command) {
                sendCommand(command);
                cmdInput.value = '';
            }
        }
        
        if((e.ctrlKey || e.metaKey) && e.key === 'k'){
            e.preventDefault();
            cmdInput.focus();
        }
        
        if((e.ctrlKey || e.metaKey) && e.key === 'n'){
            e.preventDefault();
            createNewChat();
        }
        
        if(e.key === 'Escape'){
            if (cmdInput.value) {
                cmdInput.value = '';
            } else if (!mobileDrawer.classList.contains('hidden')) {
                closeDrawerFunc();
            }
            hideContextMenu();
        }
    });

    window.__lumoInject = (txt) => appendMessage('lumo', txt);
    
    window.__setBackendUrl = (url) => {
        API_URL = url;
        BROWSER_VOICE_API_URL = url.replace('/api/command', '/api/browser_voice');
        document.getElementById('apiUrlDisplayDrawer').textContent = url.replace('/api/command', '');
        console.log('Backend URL set to:', url);
    };

</script>
</body>
</html>
